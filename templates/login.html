{% extends 'base.html' %}

{% block title %}Đăng Nhập / Đăng Ký - Melody Store{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <div style="background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07);">
        
        <!-- Tab selector -->
        <div style="display: flex; border-bottom: 2px solid #f1f5f9; margin-bottom: 1.5rem;">
            <button id="tabLoginBtn" type="button" style="flex: 1; padding: 0.75rem; border: none; background: none; font-size: 1rem; font-weight: 700; cursor: pointer; border-bottom: 2px solid #d97706; color: #d97706;" onclick="switchAuthTab('login')">
                Đăng Nhập
            </button>
            <button id="tabRegisterBtn" type="button" style="flex: 1; padding: 0.75rem; border: none; background: none; font-size: 1rem; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; color: #64748b;" onclick="switchAuthTab('register')">
                Đăng Ký
            </button>
        </div>

        <!-- Login Form -->
        <form id="customerLoginForm" style="display: block;">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="loginUsername">Tên đăng nhập</label>
                <input type="text" id="loginUsername" class="form-control" placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="loginPassword">Mật khẩu</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="btn-checkout" style="margin-top: 0;">Đăng Nhập</button>
        </form>

        <!-- Register Form -->
        <form id="customerRegisterForm" style="display: none;">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="regUsername">Tên đăng nhập (*)</label>
                <input type="text" id="regUsername" class="form-control" placeholder="Chọn tên đăng nhập" required>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="regPassword">Mật khẩu (*)</label>
                <input type="password" id="regPassword" class="form-control" placeholder="Mật khẩu ít nhất 6 ký tự" required>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="regFullName">Họ và tên (*)</label>
                <input type="text" id="regFullName" class="form-control" placeholder="Ví dụ: Trần Văn Nam" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="email@gmail.com">
                </div>
                <div class="form-group">
                    <label for="regPhone">Số điện thoại</label>
                    <input type="text" id="regPhone" class="form-control" placeholder="0901234567">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="regAddress">Địa chỉ giao hàng</label>
                <textarea id="regAddress" class="form-control" rows="2" placeholder="Số nhà, tên đường, quận/huyện..."></textarea>
            </div>

            <button type="submit" class="btn-checkout" style="margin-top: 0;">Hoàn Tất Đăng Ký</button>
        </form>

    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function switchAuthTab(tab) {
        const loginForm = document.getElementById('customerLoginForm');
        const regForm = document.getElementById('customerRegisterForm');
        const loginBtn = document.getElementById('tabLoginBtn');
        const regBtn = document.getElementById('tabRegisterBtn');

        if (tab === 'login') {
            loginForm.style.display = 'block';
            regForm.style.display = 'none';
            loginBtn.style.borderBottomColor = '#d97706';
            loginBtn.style.color = '#d97706';
            regBtn.style.borderBottomColor = 'transparent';
            regBtn.style.color = '#64748b';
        } else {
            loginForm.style.display = 'none';
            regForm.style.display = 'block';
            regBtn.style.borderBottomColor = '#d97706';
            regBtn.style.color = '#d97706';
            loginBtn.style.borderBottomColor = 'transparent';
            loginBtn.style.color = '#64748b';
        }
    }

    {% if register %}
        switchAuthTab('register');
    {% endif %}

    // Handle Login
    document.getElementById('customerLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();

        try {
            const res = await fetchAPI('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            showToast(res.message, 'success');
            setTimeout(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const nextUrl = urlParams.get('next') || '/';
                window.location.href = nextUrl;
            }, 600);
        } catch (err) {
            showToast(err.message, 'error');
        }
    });

    // Handle Register
    document.getElementById('customerRegisterForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            username: document.getElementById('regUsername').value.trim(),
            password: document.getElementById('regPassword').value.trim(),
            full_name: document.getElementById('regFullName').value.trim(),
            email: document.getElementById('regEmail').value.trim(),
            phone: document.getElementById('regPhone').value.trim(),
            address: document.getElementById('regAddress').value.trim()
        };

        try {
            const res = await fetchAPI('/api/auth/register', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            showToast('Đăng ký thành công! Đang chuyển hướng...', 'success');
            setTimeout(() => {
                window.location.href = '/';
            }, 600);
        } catch (err) {
            showToast(err.message, 'error');
        }
    });
</script>
{% endblock %}
