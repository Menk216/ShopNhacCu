<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập / Đăng Ký - Melody Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body class="auth-page">

    <!-- Header Brand -->
    <header class="auth-header">
        <a href="/" class="brand-logo auth-header-logo">
            <span>MELODY<span class="highlight">STORE</span></span>
        </a>
        <a href="/" class="btn btn-sm btn-secondary">&larr; Quay lại mua sắm</a>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h2 class="auth-title" id="authHeaderTitle">Chào Mừng Đến Melody Store</h2>
                <p class="auth-subtitle" id="authHeaderSubtitle">Đăng nhập hoặc đăng ký tài khoản để tiếp tục</p>
            </div>

            <!-- Tabs: Khách hàng Đăng nhập | Đăng ký | Quản trị viên -->
            <div class="auth-tabs" id="authTabs">
                <button type="button" class="auth-tab-btn active" data-tab="login">Đăng Nhập</button>
                <button type="button" class="auth-tab-btn" data-tab="register">Đăng Ký</button>
                <button type="button" class="auth-tab-btn" data-tab="admin">Quản Trị Viên</button>
            </div>

            <!-- 1. Customer Login Form -->
            <form id="customerLoginForm" class="auth-form active">
                <div class="form-group auth-form-group-md">
                    <label for="loginUsername">Tên đăng nhập</label>
                    <input type="text" id="loginUsername" class="form-control" placeholder="Nhập tên đăng nhập của bạn" required autofocus>
                </div>

                <div class="form-group auth-form-group-lg">
                    <label for="loginPassword">Mật khẩu</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Nhập mật khẩu" required>
                </div>

                <button type="submit" class="btn-checkout auth-btn-submit">Đăng Nhập Khách Hàng</button>
            </form>

            <!-- 2. Customer Register Form -->
            <form id="customerRegisterForm" class="auth-form">
                <div class="form-group auth-form-group-sm">
                    <label for="regUsername">Tên đăng nhập (*)</label>
                    <input type="text" id="regUsername" class="form-control" placeholder="Tên tài khoản (viết liền không dấu)" required minlength="1">
                </div>

                <div class="form-group auth-form-group-sm">
                    <label for="regPassword">Mật khẩu (*)</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Mật khẩu tối thiểu 6 ký tự" required minlength="6">
                </div>

                <div class="form-group auth-form-group-sm">
                    <label for="regFullName">Họ và tên (*)</label>
                    <input type="text" id="regFullName" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required minlength="2">
                </div>

                <div class="auth-form-grid-2">
                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="email@gmail.com">
                    </div>
                    <div class="form-group">
                        <label for="regPhone">Số điện thoại (*)</label>
                        <input type="text" id="regPhone" class="form-control" placeholder="10 số điện thoại" required maxlength="10">
                    </div>
                </div>

                <div class="form-group auth-form-group-lg">
                    <label for="regAddress">Địa chỉ nhận hàng mặc định</label>
                    <textarea id="regAddress" class="form-control" rows="2" placeholder="Số nhà, tên đường, phường/xã, quận/huyện..."></textarea>
                </div>

                <button type="submit" class="btn-checkout auth-btn-submit">Hoàn Tất Đăng Ký</button>
            </form>

            <!-- 3. Admin Login Form -->
            <form id="adminLoginForm" class="auth-form">
                <div class="auth-admin-note">
                    Dành riêng cho Quản lý & Chủ cửa hàng Melody Store.
                </div>

                <div class="form-group auth-form-group-md">
                    <label for="adminUsername">Tên đăng nhập Quản trị (*)</label>
                    <input type="text" id="adminUsername" class="form-control" placeholder="Tài khoản Quản trị viên" required>
                </div>

                <div class="form-group auth-form-group-lg">
                    <label for="adminPassword">Mật khẩu Quản trị (*)</label>
                    <input type="password" id="adminPassword" class="form-control" placeholder="Mật khẩu Quản trị" required>
                </div>

                <button type="submit" class="btn-checkout auth-btn-admin">Đăng Nhập Quản Trị Hệ Thống</button>
            </form>
        </div>
    </div>

    <footer class="auth-footer">
        &copy; Melody Store - Hệ thống phân phối nhạc cụ chính hãng.
    </footer>

    <script src="/static/js/api.js"></script>
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('customerLoginForm');
            const regForm = document.getElementById('customerRegisterForm');
            const adminForm = document.getElementById('adminLoginForm');
            const title = document.getElementById('authHeaderTitle');
            const subtitle = document.getElementById('authHeaderSubtitle');

            document.querySelectorAll('.auth-tab-btn').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-tab') === tab);
            });

            if (loginForm) loginForm.classList.toggle('active', tab === 'login');
            if (regForm) regForm.classList.toggle('active', tab === 'register');
            if (adminForm) adminForm.classList.toggle('active', tab === 'admin');

            if (tab === 'admin') {
                title.textContent = 'Quản Trị Hệ Thống';
                subtitle.textContent = 'Đăng nhập dành cho Quản lý & Nhân viên quản trị';
            } else if (tab === 'register') {
                title.textContent = 'Đăng Ký Tài Khoản';
                subtitle.textContent = 'Tạo tài khoản để đặt hàng và theo dõi bảo hành nhanh chóng';
            } else {
                title.textContent = 'Đăng Nhập Khách Hàng';
                subtitle.textContent = 'Đăng nhập tài khoản để tiếp tục mua sắm';
            }
        }

        document.getElementById('authTabs').addEventListener('click', (e) => {
            const btn = e.target.closest('.auth-tab-btn');
            if (btn) {
                switchTab(btn.getAttribute('data-tab'));
            }
        });

        // Initialize active tab based on URL path or parameters
        const path = window.location.pathname;
        const params = new URLSearchParams(window.location.search);
        if (path === '/admin/login' || params.get('role') === 'admin' || params.get('mode') === 'admin') {
            switchTab('admin');
        } else if (path === '/register' || params.get('tab') === 'register') {
            switchTab('register');
        } else {
            switchTab('login');
        }

        // Phone input sanitizer
        const phoneInput = document.getElementById('regPhone');
        if (phoneInput) {
            phoneInput.addEventListener('input', () => {
                phoneInput.value = phoneInput.value.replace(/[^0-9]/g, '').slice(0, 10);
            });
        }

        // Customer Login Submit
        document.getElementById('customerLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const res = await fetchAPI('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                showToast(res.message, 'success');
                setTimeout(() => {
                    const next = params.get('next') || '/';
                    window.location.href = next;
                }, 500);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // Customer Register Submit
        document.getElementById('customerRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const address = document.getElementById('regAddress').value.trim();

            if (username.length < 1) {
                showToast('Tên đăng nhập phải có ít nhất 1 ký tự', 'error');
                return;
            }
            if (fullName.length < 2) {
                showToast('Họ và tên phải có ít nhất 2 ký tự', 'error');
                return;
            }
            if (password.length < 6) {
                showToast('Mật khẩu phải có ít nhất 6 ký tự', 'error');
                return;
            }
            if (!phone || phone.length !== 10) {
                showToast('Số điện thoại phải gồm đúng 10 chữ số', 'error');
                return;
            }

            try {
                const res = await fetchAPI('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, password, full_name: fullName, email, phone, address })
                });
                showToast('Đăng ký thành công!', 'success');
                setTimeout(() => {
                    window.location.href = '/';
                }, 600);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // Admin Login Submit
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            try {
                const res = await fetchAPI('/api/admin/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                showToast(res.message, 'success');
                setTimeout(() => {
                    window.location.href = '/admin/dashboard';
                }, 500);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
