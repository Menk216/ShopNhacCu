<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code or 404 }} - Thông Báo Lỗi - Melody Store</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 1.5rem;
        }
        .error-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 3.5rem 2.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
        }
        .error-code {
            font-size: 4.5rem;
            font-weight: 900;
            color: #d97706;
            line-height: 1;
            margin-bottom: 0.75rem;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.75rem;
        }
        .error-message {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .error-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">{{ error_code or 404 }}</div>
        <h1 class="error-title">
            {% if error_code == 500 %}
                Đã Xảy Ra Lỗi Hệ Thống
            {% else %}
                Không Tìm Thấy Trang Yêu Cầu
            {% endif %}
        </h1>
        <p class="error-message">
            {{ error_message or 'Trang bạn đang tìm kiếm không tồn tại, đã bị xóa hoặc xảy ra sự cố kỹ thuật.' }}
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">&larr; Quay về Trang Chủ</a>
            <a href="/admin/dashboard" class="btn btn-secondary">Trang Quản Trị</a>
            <button onclick="window.history.back()" class="btn btn-secondary">Quay lại</button>
        </div>
    </div>
</body>
</html>
