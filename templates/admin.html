<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị - Melody Store</title>
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

    <!-- Admin Sidebar Navigation -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <a href="/admin/dashboard" class="sidebar-brand">MELODY <span>ADMIN</span></a>
        </div>

        <nav class="sidebar-nav">
            <a href="/admin/dashboard" class="nav-item-admin active">
                <span>Tổng quan</span>
            </a>
            <a href="/admin/users" class="nav-item-admin">
                <span>Quản lý Khách hàng</span>
            </a>
            <a href="/admin/categories" class="nav-item-admin">
                <span>Quản lý Loại sản phẩm</span>
            </a>
            <a href="/admin/products" class="nav-item-admin">
                <span>Quản lý Sản phẩm</span>
            </a>
            <a href="/admin/imports" class="nav-item-admin">
                <span>Quản lý Nhập hàng</span>
            </a>
            <a href="/admin/pricing" class="nav-item-admin">
                <span>Quản lý Giá bán & % Lãi</span>
            </a>
            <a href="/admin/orders" class="nav-item-admin">
                <span>Quản lý Đơn đặt hàng</span>
            </a>
            <a href="/admin/inventory" class="nav-item-admin">
                <span>Tồn kho & Nhập-Xuất-Tồn</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div>
                <span style="color: #64748b; font-size: 0.8rem;">Đang đăng nhập:</span>
                <div style="color: #f8fafc; font-weight: 600;">{{ current_admin.full_name or 'Quản trị viên' }}</div>
            </div>
            <button onclick="handleAdminLogout()" class="btn-admin-logout" title="Đăng xuất">
                Đăng xuất
            </button>
        </div>
    </aside>

    <!-- Main Admin Container -->
    <div class="admin-main">
        <header class="admin-topbar">
            <div class="page-title" id="adminPageTitle">Tổng Quan Quản Trị</div>
            <div class="topbar-right">
                <a href="/" target="_blank" class="btn btn-sm btn-secondary">Xem Website Bán Hàng &nearr;</a>
            </div>
        </header>

        <!-- SPA Mount Point for Admin Content -->
        <main id="admin-app" class="admin-content-inner">
            <!-- Rendered dynamically by static/js/admin/admin-router.js -->
        </main>
    </div>

    <script>
        async function handleAdminLogout() {
            if (!confirm('Bạn có chắc chắn muốn đăng xuất tài khoản Quản trị?')) return;
            try {
                await fetchAPI('/api/admin/logout', { method: 'POST' });
                window.location.href = '/admin/login';
            } catch (e) {
                window.location.href = '/admin/login';
            }
        }
    </script>
    <script src="/static/js/api.js"></script>
    <script type="module" src="/static/js/admin/admin-router.js"></script>
</body>
</html>
