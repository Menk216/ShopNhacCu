<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị Hệ Thống - Melody Store Admin</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .admin-login-box {
            background: #ffffff;
            border-radius: 14px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header .logo-icon {
            font-size: 3rem;
            color: #d97706;
            margin-bottom: 0.5rem;
        }
        .login-header h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
        }
        .login-header p {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 1.25rem;
        }
        .form-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #475569;
        }
        .form-control {
            padding: 0.65rem 0.85rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.92rem;
            outline: none;
            transition: border 0.2s;
        }
        .form-control:focus {
            border-color: #d97706;
        }
        .btn-admin-submit {
            width: 100%;
            background: #d97706;
            color: #fff;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-admin-submit:hover {
            background: #b45309;
        }
    </style>
</head>
<body>

    <div class="admin-login-box">
        <div class="login-header">
            <div class="logo-icon">🎹</div>
            <h2>QUẢN TRỊ HỆ THỐNG</h2>
            <p>Trang đăng nhập dành riêng cho Quản lý & Chủ cửa hàng</p>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="adminUsername">Tên đăng nhập Quản trị</label>
                <input type="text" id="adminUsername" class="form-control" placeholder="Tài khoản quản trị" required autofocus>
            </div>

            <div class="form-group">
                <label for="adminPassword">Mật khẩu</label>
                <input type="password" id="adminPassword" class="form-control" placeholder="Mật khẩu" required>
            </div>

            <button type="submit" class="btn-admin-submit">Đăng Nhập Quản Trị</button>

            <div style="margin-top: 1.5rem; font-size: 0.82rem; color: #64748b; background: #f8fafc; padding: 0.75rem; border-radius: 6px; text-align: center; border: 1px dashed #cbd5e1;">
                Tài khoản mặc định: <strong>admin</strong> / Mật khẩu: <strong>admin123</strong>
            </div>

            <div style="margin-top: 1.25rem; text-align: center;">
                <a href="/" style="font-size: 0.85rem; color: #64748b; text-decoration: none;">&larr; Quay lại trang bán hàng khách</a>
            </div>
        </form>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            try {
                const res = await fetchAPI('/api/admin/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                showToast('Đăng nhập thành công! Đang vào trang quản trị...', 'success');
                setTimeout(() => {
                    window.location.href = '/admin/dashboard';
                }, 600);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
